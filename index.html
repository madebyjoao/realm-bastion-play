<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0d1320">
<title>Realm Bastion</title>
<style>
:root{--gold:#ffd98a;--ink:#f4ecd8;--panel:rgba(14,16,24,.86);--line:rgba(255,226,166,.22)}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1320;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}#app canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 18px;display:flex;align-items:center;gap:7px;pointer-events:none;background:linear-gradient(180deg,rgba(8,10,16,.6),rgba(8,10,16,0))}
.stat{pointer-events:auto;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stat b{font-variant-numeric:tabular-nums;font-size:16px}
.stat.hit{animation:hit .5s}@keyframes hit{30%{background:rgba(190,40,40,.9);transform:scale(1.08)}}
.stat.wave{margin-left:auto}.stat.wave small{opacity:.65;font-size:12px}
#gear{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:38px;height:36px;font-size:17px}
#fps{position:fixed;right:10px;top:calc(52px + env(safe-area-inset-top));font-size:10px;opacity:.45;pointer-events:none}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;pointer-events:none;transition:transform .25s}
body.sheet-open #bottom{transform:translateY(140%)}
.round{pointer-events:auto;width:66px;height:66px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.round small{font-size:10.5px;font-weight:700;opacity:.85}
.round.go{background:linear-gradient(180deg,#ffd98a,#e3a043);color:#2a1806;border-color:#ffe7b0}
.round.go.spd{background:var(--panel);color:var(--ink);border-color:var(--line)}
#nextInfo{pointer-events:none;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end;max-width:46vw;margin-left:auto;margin-bottom:8px;font-size:13px}
#nextInfo span{background:rgba(10,12,18,.7);border-radius:9px;padding:3px 6px}#nextInfo span:first-child:not(.ec){opacity:.7;font-size:11px}
#nextInfo.live span{opacity:.6}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5;touch-action:pan-y}
#sheet.open{transform:none}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sh-head b{font-size:17px;font-family:Georgia,serif;color:var(--gold)}
.sh-head .x{margin-left:auto;background:rgba(255,255,255,.08);border:0;border-radius:10px;width:34px;height:32px;font-size:15px}
.sh-head .cost{font-size:14px;opacity:.9}.ic.sm{font-size:22px}
.chip{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:600}
.lvl{font-size:13px;background:rgba(255,217,138,.15);border-radius:8px;padding:3px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:7px 3px 7px;text-align:center}
.card .ic{font-size:24px}.card b{font-size:12.5px}.card .cost{font-size:12px;color:var(--gold);font-weight:700}
.card .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.card.poor{opacity:.45}.card.poor .cost{color:#ff8a7a}
.tag{font-size:9.5px;background:rgba(120,220,120,.16);border-radius:6px;padding:1px 4px;white-space:nowrap}.tag.no{background:rgba(255,110,90,.16);opacity:.85}
.blurb{margin:0 0 8px;font-size:13px;opacity:.85;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.status{margin:10px 0;font-size:13.5px;min-height:20px}.good{color:#9dff8a}.bad{color:#ff8a7a}.meh{color:#ffd98a}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:13px;padding:12px;font-size:15px;font-weight:700}
.btn.gold{background:linear-gradient(180deg,#ffd98a,#e3a043);color:#2a1806;border-color:#ffe7b0}.btn:disabled{opacity:.4}
.btn.sell{background:rgba(190,70,50,.25)}
.statline{font-size:12.5px;opacity:.85;margin:-2px 0 10px}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.path{background:rgba(255,255,255,.05);border-radius:13px;padding:8px;border:1px solid rgba(255,255,255,.07)}
.pn{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px}
.pips{display:flex;gap:3px}.pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}.pips i.r{background:#ff7a5a}.pips i.y{background:#ffd34a}
.up{box-sizing:border-box;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:rgba(255,217,138,.12);border:1px solid rgba(255,217,138,.35);border-radius:11px;padding:8px}
.p0 .up{background:rgba(255,122,90,.12);border-color:rgba(255,122,90,.4)}.p1 .up{background:rgba(255,211,74,.12);border-color:rgba(255,211,74,.4)}
.up b{font-size:13px}.up small{font-size:11px;opacity:.8;line-height:1.3}.up .cost{margin-top:3px;font-weight:800;color:var(--gold);font-size:13px}
.up.poor{opacity:.5}.up.poor .cost{color:#ff8a7a}.up.done,.up.locked{font-size:12px;opacity:.7;align-items:center;justify-content:center;min-height:60px;text-align:center}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.abil{list-style:none;margin:0;padding:0;font-size:12.5px}.abil li{padding:6px 0;opacity:.45;border-top:1px solid rgba(255,255,255,.06)}.abil li.on{opacity:1}.abil b{color:var(--gold);margin-right:4px}
.set{display:flex;align-items:center;justify-content:space-between;margin:8px 0;font-size:14px}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px}.seg button{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-weight:700;font-size:13px}.seg button.on{background:linear-gradient(180deg,#ffd98a,#e3a043);color:#2a1806}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;transition:.3s;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;max-width:84vw;text-align:center;pointer-events:none;z-index:6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translate(-50%,0)}.coach{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;transition:.3s;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:10px 14px 8px;max-width:86vw;width:340px;text-align:center;pointer-events:none;z-index:7;box-shadow:0 6px 24px rgba(0,0,0,.35)}.coach.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.quick-open .coach.show,.confirm-open .coach.show,.panel-open .coach.show,.sheet-open .coach.show{opacity:0;pointer-events:none}.coach .ct b{display:block;color:var(--gold);font-size:14px;margin-bottom:2px}.coach .ct span{font-size:13px;line-height:1.35}.coach button{margin-top:6px;background:none;border:0;color:inherit;opacity:.6;font-size:12px;text-decoration:underline}.toast b{display:block;font-size:14px;color:var(--gold)}.toast span{font-size:12.5px;opacity:.9}
.toast.intro{border-color:rgba(190,130,255,.6)}.toast.intro b{color:#d8b8ff}.toast.boss{border-color:#ff6a5a}.toast.boss b{color:#ff9a8a}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.55);z-index:8;backdrop-filter:blur(3px)}
#overlay.show{display:flex}.ov{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(86vw,360px);text-align:center}
.ov .big{display:block;font-family:Georgia,serif;font-size:30px;color:var(--gold);margin-bottom:6px}.ov.lose .big{color:#ff9a8a}.ov p{font-size:14px;opacity:.85}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 40%,#1d2a44,#0b0f19);z-index:9;transition:opacity .8s}
#loading.gone{opacity:0;pointer-events:none}#loading b{font-family:Georgia,serif;font-size:28px;color:#ffe2a6;letter-spacing:.06em}
.lb{width:200px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}#loadBar{height:100%;width:0;background:linear-gradient(90deg,#e7a94a,#ffe2a6);transition:width .3s}


#floaters{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fl{position:absolute;left:0;top:0;font:800 13px system-ui;color:#ffd34a;text-shadow:0 1px 0 #6b4a00,0 0 6px rgba(0,0,0,.6);opacity:0;white-space:nowrap;will-change:transform}
.fl.show{opacity:1}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,rgba(200,20,20,0) 45%,rgba(200,20,20,.55) 100%)}
#hurt.on{animation:hurt .6s ease-out}@keyframes hurt{0%{opacity:1}100%{opacity:0}}
.stat.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.15);background:rgba(160,120,20,.9)}}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;z-index:3;opacity:0}
#banner b{display:block;font-family:Georgia,serif;font-size:42px;color:#ffe2a6;letter-spacing:.04em;text-shadow:0 3px 0 #5a3a10,0 0 24px rgba(0,0,0,.7)}
#banner span{display:inline-block;margin-top:6px;font-size:16px;background:rgba(10,12,18,.65);border-radius:12px;padding:4px 12px}
#banner.boss b{color:#ff9a8a;text-shadow:0 3px 0 #5a1010,0 0 30px rgba(255,40,40,.6)}#banner.gold b{color:#ffd34a}#banner.storm b{color:#eaf6ff;text-shadow:0 3px 0 #2a4058,0 0 30px rgba(180,220,255,.7)}
#banner.show{animation:ban 2.2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96) translateY(-12px)}}

/* menus */
#menu{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(8,10,18,.15),rgba(8,10,18,.65));padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-y:auto;touch-action:pan-y}
#menu.show{display:flex}
body.menu #top,body.menu #bottom,body.menu #quick,body.menu #confirm,body.menu #camPad,body.menu #fps{display:none!important}
body.menu #sheet{z-index:6}
.mn-title{display:flex;flex-direction:column;align-items:center;gap:22px;width:min(92vw,380px)}
.logo{text-align:center}.logo small{display:block;font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.logo b{font-family:Georgia,serif;font-size:46px;color:#ffe2a6;letter-spacing:.04em;text-shadow:0 3px 0 #5a3a10,0 0 30px rgba(0,0,0,.7);line-height:1}
.mn-btns{display:flex;flex-direction:column;gap:10px;width:100%}
.mb{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mb small{font-size:12px;font-weight:600;opacity:.8}.mb.gold{background:linear-gradient(180deg,#ffd98a,#e3a043);color:#2a1806;border-color:#ffe7b0}.mb.ghost{background:rgba(14,16,24,.6)}
.mn-foot{font-size:11px;opacity:.6;margin:0}
.mn-panel{width:min(94vw,560px);max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mn-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mn-head b{font-family:Georgia,serif;font-size:20px;color:var(--gold)}
.back{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:22px;line-height:1}
.mn-head .xp{margin-left:auto;font-weight:800;color:var(--gold)}
.maps{display:flex;flex-direction:column;gap:10px}
.map{display:flex;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.map .art{position:relative;flex:0 0 96px;display:flex;align-items:center;justify-content:center;font-size:40px}
.map .meds{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}.md{font-size:15px;filter:grayscale(1) brightness(.6);opacity:.6}.md.on{filter:none;opacity:1}
.map .soon{position:absolute;bottom:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 6px}
.map.locked{opacity:.55}.map.locked .art span{filter:grayscale(.6)}
.mi{padding:10px 10px 10px 0;flex:1;min-width:0}.mi b{font-size:15px}.mi p{margin:3px 0 6px;font-size:12px;opacity:.8;line-height:1.35}.best{font-size:11.5px;color:var(--gold);margin-bottom:6px}
.diffs{display:flex;flex-direction:column;gap:6px}
.df{border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;background:rgba(255,255,255,.06)}.df b{font-size:14px}.df small{font-size:11px;opacity:.75}
.df.easy{border-color:rgba(140,220,120,.5)}.df.normal{border-color:rgba(255,217,138,.6);background:rgba(255,217,138,.12)}.df.hard{border-color:rgba(255,110,90,.55)}
.hero-blurb{font-size:12.5px;opacity:.8;margin:0 0 10px}
.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.hcard{position:relative;border:1px solid var(--line);border-radius:14px;padding:18px 8px 10px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-height:150px}
.hcard.on{border-color:var(--gold);background:rgba(255,217,138,.12)}.hcard.locked{opacity:.55}
.hcard .hi{font-size:28px}.hcard b{font-size:14px}.hcard small{font-size:11px;opacity:.7}.hcard p{font-size:11px;line-height:1.3;opacity:.85;margin:5px 0 0}
.hcard .hsel{position:absolute;top:6px;right:7px;font-size:10px;color:var(--gold);font-weight:800}
.modes{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:0 0 4px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}
.mode{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.06);white-space:nowrap}
.mode.on{border-color:var(--gold);background:rgba(255,217,138,.18);color:var(--gold)}
.mode-blurb{font-size:12px;opacity:.85;margin:0 0 10px;line-height:1.4}.mode-blurb .xpk{color:var(--gold);font-weight:700}
.perks{display:flex;flex-direction:column;gap:8px}
.perk{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:13px;padding:9px}
.pi{font-size:24px;width:34px;text-align:center}.pt{flex:1;display:flex;flex-direction:column;gap:2px}.pt b{font-size:14px}.pt small{font-size:11.5px;opacity:.8}
.pb{border:1px solid rgba(255,217,138,.5);background:rgba(255,217,138,.15);border-radius:11px;padding:8px 10px;font-weight:800;color:var(--gold)}.pb.poor{opacity:.45}.pmax{font-size:12px;opacity:.7;font-weight:800}
.xpl{font-size:13px;color:var(--gold)}.hint2{font-size:11.5px;opacity:.6;text-align:center;margin:8px 0 0}
@media (orientation: landscape){ .mn-foot{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center} .mn-title{flex-direction:row;width:min(92vw,720px);gap:30px;justify-content:center}.logo{flex:1}.mn-btns{flex:1;max-width:320px} .logo b{font-size:52px} }
/* quick-build floating buttons */
#quick{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);display:flex;flex-wrap:wrap;justify-content:center;gap:14px 8px;padding:4px 4px 9px;width:min(96vw,300px);opacity:0;pointer-events:none;transition:.22s;z-index:4;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
#quick.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.qb{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,226,166,.45);background:radial-gradient(circle at 35% 30%,rgba(60,66,84,.95),rgba(16,18,26,.95));display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 14px rgba(0,0,0,.45);padding:0;transition:transform .15s}
.qb .ic{font-size:21px;line-height:1}.qb .c{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:#1a1408;color:var(--gold);border:1px solid rgba(255,217,138,.5);border-radius:8px;padding:0 5px;white-space:nowrap}
.qb.on{border-color:#ffd98a;transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,217,138,.3),0 5px 14px rgba(0,0,0,.45)}
.qb.poor{filter:grayscale(.7);opacity:.6}.qb.poor .c{color:#ff8a7a}.qb.off{opacity:.25;filter:grayscale(1)}
body.quick-open #nextInfo{opacity:0}
/* confirm pill */
#confirm{position:fixed;left:50%;bottom:calc(218px + env(safe-area-inset-bottom));transform:translate(-50%,16px);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:5px 5px 5px 14px;width:min(92vw,370px);box-sizing:border-box;opacity:0;pointer-events:none;transition:.22s;z-index:4;max-width:94vw;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
#confirm.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ci{display:flex;flex-direction:column;min-width:0;margin-right:4px;flex:1}.ci b{font-size:13px;color:var(--gold);white-space:nowrap}.ci span{font-size:12px;line-height:1.25}
.cb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:18px;font-weight:800;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cb.yes{width:auto;min-width:58px;padding:0 12px;border-radius:24px;background:linear-gradient(180deg,#ffd98a,#e3a043);color:#2a1806;border-color:#ffe7b0}.cb.yes small{font-size:10.5px}.cb:disabled{opacity:.35}

/* camera pad */
.round.sm{width:54px;height:54px;font-size:20px;border-radius:17px}.round.on{border-color:#ffd98a;box-shadow:0 0 0 2px rgba(255,217,138,.35)}
#camPad{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(88px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:4}
#camPad.show{opacity:1;pointer-events:auto;transform:none}
#padRing{position:relative;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(30,34,46,.55),rgba(14,16,24,.82));border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
